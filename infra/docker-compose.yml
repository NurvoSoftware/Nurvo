services:
  backend:
    build:
      context: ../nurvobackend
      dockerfile: Dockerfile
    container_name: nurvo-backend
    ports:
      - "8000:8000"
    expose:
      - "8000"
    env_file:
      - ../nurvobackend/.env
    restart: unless-stopped
    volumes:
      - nurvo_data:/app/data

  frontend:
    build:
      context: ../nurvofronted
      dockerfile: Dockerfile
    container_name: nurvo-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  nurvo_data:
