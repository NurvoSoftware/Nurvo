    <!-- Structured Data: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Nurvo",
      "description": "AI 驅動護理溝通訓練平台，與 AI 病患及家屬互動，即時獲得量化回饋。",
      "url": "https://nurvo.ai",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "inLanguage": "zh-TW",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "TWD" }
    }
    </script>

    <!-- Structured Data: FAQPage (Google Rich Results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Nurvo 是什麼？",
          "acceptedAnswer": { "@type": "Answer", "text": "Nurvo 是 AI 驅動的護理溝通訓練平台。學員透過與 AI 病患及家屬對話，在安全環境中練習臨床溝通技巧，結束後立即獲得多維度量化回饋報告。" }
        },
        {
          "@type": "Question",
          "name": "需要安裝任何軟體嗎？",
          "acceptedAnswer": { "@type": "Answer", "text": "不需要。Nurvo 是純網頁平台，只要有現代瀏覽器即可開始訓練，無須下載或安裝任何應用程式。" }
        },
        {
          "@type": "Question",
          "name": "支援語音輸入嗎？",
          "acceptedAnswer": { "@type": "Answer", "text": "支援。Nurvo 整合語音轉文字技術，讓學員可以用說話的方式與 AI 角色互動，更貼近真實臨床對話情境。" }
        },
        {
          "@type": "Question",
          "name": "適合哪些人使用？",
          "acceptedAnswer": { "@type": "Answer", "text": "主要適合護理學生、新進護理師及在職護理人員。也歡迎護理學校、醫院、培訓機構洽詢團體授權方案。" }
        },
        {
          "@type": "Question",
          "name": "訓練記錄會儲存嗎？",
          "acceptedAnswer": { "@type": "Answer", "text": "目前 MVP 階段，記錄儲存於當次工作階段，瀏覽器重整後清除。完整的資料持久化功能正在規劃中。" }
        },
        {
          "@type": "Question",
          "name": "如何洽談機構合作？",
          "acceptedAnswer": { "@type": "Answer", "text": "請透過頁面下方「聯絡我們」與我們聯繫，我們將安排線上演示並提供客製化導入方案。" }
        }
      ]
    }
    </script>
